<div style="background: var(--surface-1); border-radius: 20px; padding: 1.25rem 1rem; max-width: 380px; margin: 0 auto;">

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;">
    <button onclick="sendPrompt('재료로 찾기 화면으로 돌아가줘')" style="width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;" aria-label="뒤로가기">
      <i class="ti ti-arrow-left" style="font-size: 16px; color: var(--text-secondary);" aria-hidden="true"></i>
    </button>
    <p style="font-size: 15px; font-weight: 500; margin: 0;">재료로 찾기</p>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem;">
    <span style="font-size: 12px; padding: 6px 10px; border-radius: 100px; background: #EEEDFE; color: #3C3489;">돼지고기</span>
    <span style="font-size: 12px; padding: 6px 10px; border-radius: 100px; background: #EEEDFE; color: #3C3489;">양파</span>
    <span style="font-size: 12px; padding: 6px 10px; border-radius: 100px; background: #EEEDFE; color: #3C3489;">대파</span>
  </div>

  <p style="font-size: 14px; font-weight: 500; margin: 0 0 4px;">이 재료로 만들 수 있는 레시피</p>
  <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 1.25rem;">일치율 순으로 정렬했어요</p>

  <div style="display: flex; flex-direction: column; gap: 10px;">

    <button onclick="sendPrompt('제육볶음 레시피 자세히 보여줘')" style="width: 100%; text-align: left; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; display: flex; gap: 12px; position: relative;">
      <div style="width: 64px; height: 64px; border-radius: 10px; background: #EEEDFE; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i class="ti ti-toque" style="font-size: 24px; color: #534AB7;" aria-hidden="true"></i>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
          <p style="font-weight: 500; font-size: 14px; margin: 0;">제육볶음</p>
          <span style="font-size: 11px; padding: 2px 8px; border-radius: 100px; background: #E1F5EE; color: #085041; flex-shrink: 0;">일치 100%</span>
        </div>
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 6px;">돼지고기, 양파, 대파 그대로 사용</p>
        <span style="font-size: 11px; color: var(--text-muted);"><i class="ti ti-clock" style="font-size: 12px; vertical-align: -1px;" aria-hidden="true"></i> 25분</span>
      </div>
    </button>

    <button onclick="sendPrompt('돼지고기 대파 볶음 레시피 자세히 보여줘')" style="width: 100%; text-align: left; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; display: flex; gap: 12px;">
      <div style="width: 64px; height: 64px; border-radius: 10px; background: #EEEDFE; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i class="ti ti-soup" style="font-size: 24px; color: #534AB7;" aria-hidden="true"></i>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
          <p style="font-weight: 500; font-size: 14px; margin: 0;">돼지고기 대파 볶음</p>
          <span style="font-size: 11px; padding: 2px 8px; border-radius: 100px; background: #E1F5EE; color: #085041; flex-shrink: 0;">일치 100%</span>
        </div>
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 6px;">돼지고기, 양파, 대파 그대로 사용</p>
        <span style="font-size: 11px; color: var(--text-muted);"><i class="ti ti-clock" style="font-size: 12px; vertical-align: -1px;" aria-hidden="true"></i> 15분</span>
      </div>
    </button>

    <button onclick="sendPrompt('돈부리 덮밥 레시피 자세히 보여줘')" style="width: 100%; text-align: left; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; display: flex; gap: 12px;">
      <div style="width: 64px; height: 64px; border-radius: 10px; background: #EEEDFE; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i class="ti ti-bowl" style="font-size: 24px; color: #534AB7;" aria-hidden="true"></i>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
          <p style="font-weight: 500; font-size: 14px; margin: 0;">돼지고기 덮밥</p>
          <span style="font-size: 11px; padding: 2px 8px; border-radius: 100px; background: #FAEEDA; color: #633806; flex-shrink: 0;">일치 90%</span>
        </div>
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 6px;">달걀 1개만 추가하면 완성</p>
        <span style="font-size: 11px; color: var(--text-muted);"><i class="ti ti-clock" style="font-size: 12px; vertical-align: -1px;" aria-hidden="true"></i> 18분</span>
      </div>
    </button>

    <button onclick="sendPrompt('돼지고기 김치찜 레시피 자세히 보여줘')" style="width: 100%; text-align: left; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px; display: flex; gap: 12px;">
      <div style="width: 64px; height: 64px; border-radius: 10px; background: #EEEDFE; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i class="ti ti-flame" style="font-size: 24px; color: #534AB7;" aria-hidden="true"></i>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
          <p style="font-weight: 500; font-size: 14px; margin: 0;">돼지고기 김치찜</p>
          <span style="font-size: 11px; padding: 2px 8px; border-radius: 100px; background: #FAEEDA; color: #633806; flex-shrink: 0;">일치 80%</span>
        </div>
        <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 6px;">김치, 두부 추가하면 완성</p>
        <span style="font-size: 11px; color: var(--text-muted);"><i class="ti ti-clock" style="font-size: 12px; vertical-align: -1px;" aria-hidden="true"></i> 40분</span>
      </div>
    </button>

  </div>

</div>
